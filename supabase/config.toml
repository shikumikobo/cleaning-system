# Supabase のローカルの設定（supabase start）。キー・パスワードはここに書かない。
project_id = "cleaning"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# ログインはメールのリンク（パスワードなし）だけ（R-001-13）。パスワードを持つ利用者は DB のトリガーでも作れない。
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# 機能 001：Edge Function（ログインの鍵つきの呼び出しだけ受ける）
[functions.invite-user]
verify_jwt = true

[functions.create-tenant]
verify_jwt = true
